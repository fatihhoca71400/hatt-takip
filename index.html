<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H-AAT Acil Ambulans Takip</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; }
    #map { height: 100%; width: 100%; }
    .status-card {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: white; padding: 12px 20px; border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; text-align: center;
      min-width: 260px;
    }
    .status-title { font-weight: bold; color: #b71c1c; font-size: 15px; margin-bottom: 4px; }
    .status-desc { font-size: 13px; color: #333; }

    /* Ambulans İkon Stili ve Yanıp Sönme Efekti */
    .ambulance-marker {
      background: white;
      border: 2px solid #b71c1c;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 0 15px rgba(183, 28, 28, 0.6);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.7); }
      70% { box-shadow: 0 0 0 14px rgba(211, 47, 47, 0); }
      100% { box-shadow: 0 0 0 0 rgba(211, 47, 47, 0); }
    }
  </style>
</head>
<body>

<div class="status-card">
  <div class="status-title">🚑 H-AAT Acil Ambulans Takibi</div>
  <div id="status" class="status-desc" style="color: orange; font-weight: bold;">GPS sinyali aranıyor...</div>
</div>

<div id="map"></div>

<script>
  const firebaseConfig = {
    databaseURL: "https://h-att-293ad-default-rtdb.firebaseio.com"
  };
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  const map = L.map('map').setView([41.3388, 36.2497], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // Özel Ambulans İkonu
  const ambulanceIcon = L.divIcon({
    className: 'custom-div-icon',
    html: "<div class='ambulance-marker'>🚑</div>",
    iconSize: [44, 44],
    iconAnchor: [22, 22]
  });

  let marker = null;
  const urlParams = new URLSearchParams(window.location.search);
  const takipId = urlParams.get('id');

  if (!takipId) {
    document.getElementById('status').innerText = 'Hata: Takip parametresi eksik!';
    document.getElementById('status').style.color = 'red';
  } else {
    const path = "HATT_copy_test_copy_last/" + takipId;
    
    database.ref(path).on('value', (snapshot) => {
      let data = snapshot.val();
      if (!data) {
        database.ref(takipId).once('value', (s2) => {
          let rootData = s2.val();
          if (rootData) islemYap(rootData);
        });
      } else {
        islemYap(data);
      }
    });
  }

  function islemYap(data) {
    let clean = String(data).replace(/["'\\]/g, '').trim();
    let coords = clean.split(',');

    if (coords.length >= 2) {
      let lat = parseFloat(coords[0]);
      let lng = parseFloat(coords[1]);

      if (!isNaN(lat) && !isNaN(lng) && (lat !== 0 || lng !== 0)) {
        document.getElementById('status').innerText = 'Ambulans Canlı Takipte 🟢';
        document.getElementById('status').style.color = 'green';

        if (!marker) {
          marker = L.marker([lat, lng], { icon: ambulanceIcon }).addTo(map);
          map.setView([lat, lng], 16);
        } else {
          marker.setLatLng([lat, lng]);
        }
      }
    }
  }
</script>
</body>
</html>
