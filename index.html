<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H-AAT Acil Ambulans Takip</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; }
    #map { height: 100%; width: 100%; }
    .status-card {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: white; padding: 12px 20px; border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25); z-index: 1000; text-align: center;
      min-width: 280px;
    }
    .status-title { font-weight: bold; color: #b71c1c; font-size: 15px; margin-bottom: 4px; }
    .status-desc { font-size: 13px; color: #333; }
    .debug-text { font-size: 11px; color: #666; margin-top: 4px; word-break: break-all; }
  </style>
</head>
<body>

<div class="status-card">
  <div class="status-title">🚑 H-AAT Acil Ambulans Takibi</div>
  <div id="status" class="status-desc" style="color: orange; font-weight: bold;">GPS sinyali aranıyor...</div>
  <div id="debug" class="debug-text">Bağlantı kuruluyor...</div>
</div>

<div id="map"></div>

<script>
  const firebaseConfig = {
    databaseURL: "https://h-att-293ad-default-rtdb.firebaseio.com"
  };
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  const map = L.map('map').setView([41.3388, 36.2497], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  let marker = null;
  const urlParams = new URLSearchParams(window.location.search);
  const takipId = urlParams.get('id');
  const debugEl = document.getElementById('debug');

  function haritadaGoster(lat, lng) {
    document.getElementById('status').innerText = 'Ambulans Canlı Takipte 🟢';
    document.getElementById('status').style.color = 'green';

    const customAmbulance = L.divIcon({
      className: '',
      html: "<div style='font-size:32px; filter: drop-shadow(0 0 5px red);'>🚑</div>",
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });

    if (!marker) {
      marker = L.marker([lat, lng], { icon: customAmbulance }).addTo(map);
      map.setView([lat, lng], 16);
    } else {
      marker.setLatLng([lat, lng]);
    }
  }

  function veriyiIsle(veri, kaynak) {
    debugEl.innerText = kaynak + " üzerinden veri geldi: " + veri;
    let clean = String(veri).replace(/["'\\]/g, '').trim();
    let coords = clean.split(',');
    if (coords.length >= 2) {
      let lat = parseFloat(coords[0]);
      let lng = parseFloat(coords[1]);
      if (!isNaN(lat) && !isNaN(lng)) {
        haritadaGoster(lat, lng);
      }
    }
  }

  if (!takipId) {
    document.getElementById('status').innerText = 'Hata: Takip parametresi eksik!';
    debugEl.innerText = 'URL sonuna ?id=... eklenmedi.';
  } else {
    debugEl.innerText = 'Aranan ID: ' + takipId;

    // 1. Yol: Klasör altı
    database.ref("HATT_copy_test_copy_last/" + takipId).on('value', (s) => {
      if (s.exists()) {
        veriyiIsle(s.val(), "Klasör");
      }
    });

    // 2. Yol: Kök dizin
    database.ref(takipId).on('value', (s) => {
      if (s.exists()) {
        veriyiIsle(s.val(), "Kök");
      }
    });
  }
</script>
</body>
</html>
