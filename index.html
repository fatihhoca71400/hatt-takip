<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>HATT Acil Ambulans Canlı Takip Sistemi</title>
  
  <!-- Harita Motoru (Leaflet) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase Kütüphaneleri -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { height: 100vh; width: 100%; }
    .bilgi-karti {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      z-index: 1000;
      text-align: center;
      width: 85%;
      max-width: 400px;
    }
    .baslik { font-size: 15px; font-weight: bold; color: #c62828; margin-bottom: 4px; }
    .durum { font-size: 13px; color: #2e7d32; font-weight: 600; }
  </style>
</head>
<body>

  <div class="bilgi-karti">
    <div class="baslik">🚑 H-AAT Acil Ambulans Takibi</div>
    <div id="durumYazisi" class="durum">Konum aranıyor...</div>
  </div>

  <div id="map"></div>

  <script>
    // URL'den takip ID'sini yakala (?id=KONUM_12345678901)
    const urlParams = new URLSearchParams(window.location.search);
    const hastaID = urlParams.get('id');

    // Firebase Realtime Database Adresiniz
    // (App Inventor'da FirebaseDB1 bileşeninde yazan adresle aynı olmalıdır)
    const firebaseConfig = {
      databaseURL: "https://h-att-293ad-default-rtdb.firebaseio.com" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Harita kurulumu (Varsayılan Türkiye merkezli)
    const map = L.map('map').setView([41.2867, 36.3312], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let ambulansMarker = null;

    if (!hastaID) {
      document.getElementById('durumYazisi').innerText = "Hata: Takip parametresi eksik!";
      document.getElementById('durumYazisi').style.color = "red";
    } else {
      // Firebase'den anlık koordinat dinleme
      db.ref(hastaID).on('value', (snapshot) => {
        const konumMetni = snapshot.val();
        if (konumMetni && typeof konumMetni === 'string') {
          const parcalar = konumMetni.split(',');
          const enlem = parseFloat(parcalar[0]);
          const boylam = parseFloat(parcalar[1]);

          if (!isNaN(enlem) && !isNaN(boylam)) {
            if (!ambulansMarker) {
              ambulansMarker = L.marker([enlem, boylam]).addTo(map)
                .bindPopup("<b>Ambulans Canlı Konumu</b>").openPopup();
            } else {
              ambulansMarker.setLatLng([enlem, boylam]);
            }
            map.panTo([enlem, boylam]);
            document.getElementById('durumYazisi').innerText = "● Ambulans Hareket Halinde (Canlı)";
          }
        } else {
          document.getElementById('durumYazisi').innerText = "GPS sinyali bekleniyor...";
        }
      });
    }
  </script>
</body>
</html>
