<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H-AAT Acil Ambulans Takip</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; }
    #map { height: 100%; width: 100%; }
    .status-card {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: white; padding: 12px 20px; border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; text-align: center;
      min-width: 260px;
    }
    .status-title { font-weight: bold; color: #b71c1c; font-size: 15px; margin-bottom: 4px; }
    .status-desc { font-size: 13px; color: #333; }
  </style>
</head>
<body>

<div class="status-card">
  <div class="status-title">🚑 H-AAT Acil Ambulans Takibi</div>
  <div id="status" class="status-desc" style="color: orange; font-weight: bold;">GPS sinyali aranıyor...</div>
</div>

<div id="map"></div>

<script>
  const firebaseConfig = {
    databaseURL: "https://h-att-293ad-default-rtdb.firebaseio.com"
  };
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  const map = L.map('map').setView([41.3388, 36.2497], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  let marker = null;
  const urlParams = new URLSearchParams(window.location.search);
  const takipId = urlParams.get('id');

  if (!takipId) {
    document.getElementById('status').innerText = 'Hata: Takip parametresi eksik!';
    document.getElementById('status').style.color = 'red';
  } else {
    // Klasör altındaysa da doğrudan bulması için yolu hazırla
    const path = "HATT_copy_test_copy_last/" + takipId;
    
    database.ref(path).on('value', (snapshot) => {
      let data = snapshot.val();
      
      // Eğer klasör altında bulamazsa bir de kök dizine baksın
      if (!data) {
        database.ref(takipId).once('value', (s2) => {
          let rootData = s2.val();
          if (rootData) islemYap(rootData);
        });
      } else {
        islemYap(data);
      }
    });
  }

  function islemYap(data) {
    // Fazladan gelen tüm tırnak, ters slaş ve boşlukları temizle
    let clean = String(data).replace(/["'\\]/g, '').trim();
    let coords = clean.split(',');

    if (coords.length >= 2) {
      let lat = parseFloat(coords[0]);
      let lng = parseFloat(coords[1]);

      if (!isNaN(lat) && !isNaN(lng) && (lat !== 0 || lng !== 0)) {
        document.getElementById('status').innerText = 'Ambulans Canlı Takipte 🟢';
        document.getElementById('status').style.color = 'green';

        // Ambulans simgesi (SVG formatında, sorunsuz yüklenir)
        const ambulanceIcon = L.icon({
          iconUrl: 'https://cdn-icons-png.flaticon.com/512/2893/2893811.png',
          iconSize: [46, 46],
          iconAnchor: [23, 23]
        });

        if (!marker) {
          marker = L.marker([lat, lng], { icon: ambulanceIcon }).addTo(map);
          map.setView([lat, lng], 16);
        } else {
          marker.setLatLng([lat, lng]);
        }
      }
    }
  }
</script>
</body>
</html>
